name: 更新股價

on:
  schedule:
    # 週一到週五 16:13（台北時間），證交所與櫃買中心收盤資料都已公布
    - cron: '13 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_quotes.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/tw_quotes.json data/global_quotes.json data/update_status.json
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新股價 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
